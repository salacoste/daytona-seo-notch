[project]
name = "daytona-seo-notch-runtime"
version = "0.1.0"
description = "Python runtime for the daytona-seo-notch Antigravity skills (scripts from AgriciDaniel/claude-seo, MIT)"
requires-python = ">=3.11"
license = "MIT"

# Core audit dependencies only. Google APIs and PDF/Excel reporting are
# optional groups: `uv sync --group google` / `--group reports`.
dependencies = [
    "beautifulsoup4>=4.15.0,<5.0.0",
    "requests>=2.34.2,<3.0.0",
    "lxml>=6.1.1,<7.0.0",
    "lxml_html_clean>=0.4.5,<1.0.0",
    "urllib3>=2.7.0,<3.0.0",
    "trafilatura>=2.2.0,<3.0.0",
    "htmldate>=1.10.0,<2.0.0",
    "courlan>=1.4.0,<2.0.0",
    "playwright>=1.62.0,<2.0.0",
]

[dependency-groups]
google = [
    "google-api-python-client>=2.196.0,<3.0.0",
    "google-auth>=2.56.2,<3.0.0",
    "google-auth-httplib2>=0.4.2,<1.0.0",
    "google-analytics-data>=0.18.0,<1.0.0",
    "google-ads>=31.4.0,<40.0.0",
]
reports = [
    "matplotlib>=3.9.0,<4.0.0",
    "numpy>=2.2.6,<3.0.0",
    "weasyprint>=70.0,<71.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pillow>=13.0.0,<14.0.0",
]

[tool.uv]
# Keep the environment inside the runtime folder, out of the skill tree.
package = false
